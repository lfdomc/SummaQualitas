<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Debug de Autenticación</h1>
    <div id="output"></div>
    <button onclick="testLogin()">Probar Login</button>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            const p = document.createElement('p');
            p.textContent = message;
            output.appendChild(p);
            console.log(message);
        }
        
        async function testLogin() {
            try {
                log('🔧 Iniciando test de login...');
                
                // Configurar cliente de Supabase
                const supabaseUrl = 'https://hypravgvtrlfpepslhmc.supabase.co';
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJhdmd2dHJsZnBlcHNsaG1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjY2MjE3NzQsImV4cCI6MjA0MjE5Nzc3NH0.Ej6Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8';
                
                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                
                log('✅ Cliente de Supabase creado');
                
                // Intentar login
                log('🔐 Intentando login...');
                const result = await supabase.auth.signInWithPassword({
                    email: 'lfdomc@gmail.com',
                    password: 'admin123'
                });
                
                if (result.error) {
                    log('❌ Error en login: ' + result.error.message);
                } else {
                    log('✅ Login exitoso: ' + result.data.user.email);
                    
                    // Verificar sesión
                    const session = await supabase.auth.getSession();
                    log('📋 Sesión: ' + (session.data.session ? 'Activa' : 'Inactiva'));
                    
                    // Probar API
                    const response = await fetch('/api/auth/status');
                    const apiData = await response.json();
                    log('📊 API Response: ' + JSON.stringify(apiData));
                }
                
            } catch (error) {
                log('❌ Error: ' + error.message);
            }
        }
        
        // Auto-ejecutar al cargar
        window.onload = function() {
            log('Página cargada. Haz clic en "Probar Login" para comenzar.');
        };
    </script>
</body>
</html>
